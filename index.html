<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;

	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {

	}

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

/* visual tweaks */

.leaflet-container {

	}
.leaflet-zoom-box {

/* general typography */
.leaflet-container {

	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	display: block;
	text-align: center;

.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-control-layers {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {
	position: absolute;

.leaflet-popup-content-wrapper {

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

<style>
:root{
  --paper:#FFFCF6;--ink:#3E3A39;--ink-soft:#6E6866;--coral:#F2A497;--yellow:#F6D27A;--water:#A8D3E6;--green:#B9DAA5;--sand:#F7EEDD;--lilac:#E8D9F0;
  --line:3px;--r-lg:26px;--r-md:16px;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;max-width:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
h1,h2,h3{font-weight:400;margin:0;line-height:1.3}

/* Header */
.top{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:var(--line) solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:1200}
.top-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.top h1{font-size:19px;flex:1;min-width:0}
.top h1 small{display:block;font-size:12.5px;color:var(--ink-soft)}
.logo{width:40px;height:40px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px;max-width:1100px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;background:var(--paper)}
.chip.tbc{background:var(--sand)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:1100px;margin:8px auto 0}
.day-btn{min-width:0;border:var(--line) solid var(--ink);border-radius:var(--r-md);background:var(--paper);padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;line-height:1.2;transition:transform .15s}
.day-btn b{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.day-btn small{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.day-btn[aria-selected="true"]{background:var(--yellow);transform:translateY(-2px)}

/* Map */
.stage{position:relative;max-width:1100px;margin:0 auto}
.mapbox{position:relative;height:62vh;min-height:360px;border-bottom:var(--line) solid var(--ink);background:#cfe6ef}
#map{position:absolute;inset:0;background:#cfe6ef;font-family:var(--font)}
.leaflet-container{font-family:var(--font)}
.leaflet-tile-pane{filter:saturate(.75) sepia(.12) brightness(1.03)}
.summary{position:absolute;left:10px;top:10px;right:64px;z-index:500;pointer-events:none;display:flex}
.summary div{pointer-events:auto;background:var(--paper);border:var(--line) solid var(--ink);border-radius:var(--r-md);padding:4px 10px;font-size:13px;max-width:100%;line-height:1.45}
.summary b{font-weight:400}
.fab{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.fab button{width:46px;height:46px;border:var(--line) solid var(--ink);border-radius:14px;background:var(--paper);display:grid;place-items:center;font-size:11px;line-height:1.1;padding:2px}
.fab svg{width:22px;height:22px}
.ctrl{position:absolute;left:0;right:0;bottom:12px;z-index:600;display:flex;justify-content:center;gap:8px;padding:0 10px;pointer-events:none}
.ctrl button{pointer-events:auto;border:var(--line) solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 14px;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctrl button.main{background:var(--coral);font-size:16px;padding:8px 20px}
.ctrl button:disabled{opacity:.45;cursor:default}
.ctrl svg{width:18px;height:18px}
.leaflet-bottom.leaflet-right{bottom:58px}
body.sheet-open .summary{display:none}
.offline{position:absolute;left:10px;bottom:64px;z-index:500;background:var(--sand);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:12.5px;display:none}

/* map markers */
.pin{width:34px;height:34px;border-radius:50%;border:var(--line) solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:15px;line-height:1;box-shadow:0 2px 0 var(--ink);transition:transform .2s}
.pin.done{background:var(--green)}
.pin.now{background:var(--yellow);transform:scale(1.18)}
.pin.home{background:var(--water)}
.pin.opt{border-style:dashed}
.pin svg{width:18px;height:18px}
.pin-label{background:var(--paper)!important;border:2px solid var(--ink)!important;border-radius:999px!important;box-shadow:none!important;padding:0 8px!important;font-family:var(--font);font-size:12px;color:var(--ink)!important;white-space:nowrap}
.pin-label::before{display:none}
.leg-chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:11.5px;white-space:nowrap;display:inline-block;transform:translate(-50%,-50%);font-family:var(--font)}
.leg-chip.sketch{background:var(--sand);border-style:dashed}
.vehicle{width:54px;height:36px;transform-origin:50% 70%}
.vehicle svg{width:54px;height:36px;display:block;transition:transform .2s}
.vehicle.flip svg{transform:scaleX(-1)}

/* Timeline */
main{max-width:1100px;margin:0 auto;padding:16px 14px 120px;display:grid;gap:22px}
@media (min-width:900px){main{grid-template-columns:1.3fr 1fr;align-items:start}}
.sec-title{display:flex;align-items:center;gap:8px;font-size:20px;margin-bottom:10px}
.sec-title .dot{width:14px;height:14px;border-radius:50%;border:var(--line) solid var(--ink);flex:none}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl>li{position:relative;padding:0 0 4px 30px}
.tl>li::before{content:"";position:absolute;left:10px;top:18px;bottom:-4px;border-left:3px dotted var(--ink)}
.tl>li:last-child::before{display:none}
.tl .dotm{position:absolute;left:0;top:6px;width:23px;height:23px;border-radius:50%;border:var(--line) solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:11px}
.tl li.pending .dotm{border-style:dashed;background:var(--sand)}
.tl li.isnow .dotm{background:var(--yellow)}
.tl li.isdone .dotm{background:var(--green)}
.tl li.skipped{opacity:.5}
.row{width:100%;text-align:left;border:2px solid var(--ink);border-radius:var(--r-md);background:var(--paper);padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.tl li.pending .row{border-style:dashed}
.tl li.big .row{background:var(--coral)}
.row .tm{font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.row .ti{font-size:16.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 8px;line-height:1.55;background:var(--paper)}
.tag.pend{background:var(--sand);border-style:dashed}
.tag.fix{background:var(--coral)}
.tag.skip{background:var(--green)}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);padding:6px 0 8px 2px}
.leg svg{width:26px;height:18px;flex:none}
.leg a{font-size:12.5px}
.leg .sk{border:2px dashed var(--ink);border-radius:999px;padding:0 7px;font-size:11.5px;background:var(--sand);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opt{border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:13.5px;background:var(--paper)}
.opt[aria-pressed="true"]{background:var(--yellow)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-top:2px}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border:2px solid var(--ink);border-radius:999px;background:var(--green);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:20px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);transition:left .15s}
.switch input:not(:checked){background:var(--sand)}
.switch input:not(:checked)::after{left:2px}

.card{border:var(--line) solid var(--ink);border-radius:var(--r-lg);padding:14px 16px;background:var(--paper)}
.side{display:grid;gap:16px}
.side h3{font-size:17px;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.pills li{border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13.5px;background:var(--sand)}
.pills.cut li{text-decoration:line-through;background:var(--paper);color:var(--ink-soft)}
.todo{margin:0;padding-left:1.3em;font-size:14.5px}
.todo li+li{margin-top:3px}
.src{font-size:12.5px;color:var(--ink-soft);margin:0;padding-left:1.2em}
footer{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:0 16px 40px}

/* Bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:var(--paper);border-top:var(--line) solid var(--ink);border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:46vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.3,.5,1);box-shadow:0 -4px 0 rgba(62,58,57,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet.tall{max-height:86vh}
@media (min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;top:auto;width:400px;max-height:calc(100vh - 32px);border:var(--line) solid var(--ink);border-radius:var(--r-lg);transform:translateX(120%)}
  .sheet.open{transform:none}
  .sheet.tall{max-height:calc(100vh - 32px)}
}
.grab{width:100%;border:0;background:transparent;padding:8px 0 2px;display:flex;justify-content:center}
.grab i{display:block;width:48px;height:6px;border-radius:9px;background:var(--ink)}
.sh-head{flex:none;padding:2px 16px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:2px dashed var(--ink)}
.sh-head .num{flex:none;width:36px;height:36px;border-radius:50%;border:var(--line) solid var(--ink);background:var(--yellow);display:grid;place-items:center;font-size:16px}
.sh-head h2{font-size:20px}
.sh-head .sub{font-size:13px;color:var(--ink-soft)}
.sh-head .x{margin-left:auto;flex:none;width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);font-size:18px;line-height:1}
.sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 16px 14px;display:grid;gap:12px;overscroll-behavior:contain}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.times div{border:2px solid var(--ink);border-radius:12px;padding:4px 6px;text-align:center;background:var(--sand)}
.times small{display:block;font-size:11.5px;color:var(--ink-soft)}
.times b{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.plan-note{font-size:11.5px;color:var(--ink-soft);margin-top:-6px}
.what{font-size:15.5px}
.steps{margin:0;padding-left:1.4em;font-size:14.5px}
.steps li+li{margin-top:2px}
.alert{border:2px solid var(--ink);border-radius:12px;background:#FCE3DD;padding:8px 10px;font-size:14px}
.alert b{font-weight:400}
.alert ul{margin:4px 0 0;padding-left:1.2em}
details{border:2px solid var(--ink);border-radius:14px;background:var(--paper)}
summary{padding:8px 12px;cursor:pointer;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto}
details[open] summary::after{content:"－"}
.dbody{padding:0 12px 10px;display:grid;gap:8px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}
.kv dt{color:var(--ink-soft);font-size:13px;white-space:nowrap}
.kv dd{margin:0}
.badge{display:inline-block;font-size:11px;border:1.5px solid var(--ink);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.badge.ok{background:var(--green)}
.badge.tbc{background:var(--sand);border-style:dashed}
.srcline{font-size:11.5px;color:var(--ink-soft)}
.food{border:2px solid var(--ink);border-radius:12px;padding:7px 10px;background:var(--sand)}
.food b{font-weight:400;font-size:15px}
.food p{margin:2px 0 0;font-size:13px}
.maplink{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;text-decoration:none;background:var(--water)}
.sh-foot{flex:none;display:flex;gap:8px;padding:10px 16px 12px;border-top:2px dashed var(--ink)}
.sh-foot button{flex:1;border:var(--line) solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 0;font-size:15px}
.sh-foot button.main{background:var(--coral)}
.sh-foot button:disabled{opacity:.4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3"/><path d="M13 31c5-2 6-9 11-11s8 2 11 0" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/><circle cx="31" cy="15" r="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/></svg>
    <h1 id="title">沖繩 5 天 4 夜<small id="dates"></small></h1>
  </div>
  <div class="chips" id="chips"></div>
  <div class="days" id="days" role="tablist" aria-label="選擇日期"></div>
</header>

<div class="stage">
  <div class="mapbox">
    <div id="map" aria-label="行程地圖"></div>
    <div class="summary"><div id="summary"></div></div>
    <div class="fab">
      <button id="btnFit" title="當日全覽" aria-label="當日全覽"><svg viewBox="0 0 24 24" fill="none" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全覽</button>
    </div>
    <div class="offline" id="offline">插畫底圖模式：路線為示意，實際道路請點「Google Maps 路線」</div>
    <div class="ctrl">
      <button id="btnPrev" aria-label="上一站"><svg viewBox="0 0 24 24" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>上一站</button>
      <button id="btnMain" class="main">開始行程</button>
      <button id="btnReplay" aria-label="重播今日"><svg viewBox="0 0 24 24" fill="none" stroke="#3E3A39" stroke-width="2.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>重播</button>
    </div>
  </div>
</div>

<main>
  <section>
    <h2 class="sec-title"><span class="dot" id="dayDot"></span><span id="tlTitle">時間軸</span></h2>
    <ol class="tl" id="timeline"></ol>
  </section>
  <aside class="side">
    <div class="card">
      <h3>還沒處理的</h3>
      <ol class="todo" id="todo"></ol>
    </div>
    <div class="card">
      <h3>尚未排入的候選</h3>
      <ul class="pills" id="wish"></ul>
      <h3 style="margin-top:12px">這次拿掉的</h3>
      <ul class="pills cut" id="cut"></ul>
    </div>
    <div class="card">
      <h3>資料來源</h3>
      <p style="font-size:13px;margin:0 0 6px">官方資料查詢日期：<span id="qdate"></span>。2027 年資訊請出發前再確認。路線時間為行程預估；實際道路路線使用 OpenStreetMap／OSRM。</p>
      <ul class="src" id="srcList"></ul>
    </div>
  </aside>
</main>
<footer>めんそーれ！祝旅途愉快</footer>

<section class="sheet" id="sheet" aria-live="polite" aria-label="站點資訊">
  <button class="grab" id="grab" aria-label="展開或收合資訊卡"><i></i></button>
  <div class="sh-head">
    <span class="num" id="shNum">1</span>
    <div><h2 id="shTitle"></h2><div class="sub" id="shSub"></div></div>
    <button class="x" id="shClose" aria-label="收起">×</button>
  </div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot">
    <button id="shPrev">上一站</button>
    <button id="shNext" class="main">下一站</button>
  </div>
</section>

<script>
(function(){
'use strict';
var INK='#3E3A39';
var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- SVG ---------- */
var SVG = {
  van: '<svg viewBox="0 0 54 36" aria-hidden="true"><path d="M4 27V14q0-6 6-6h28q5 0 8 4.5l4 6q1.5 2 1.5 4V27Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.6" stroke-linejoin="round"/><rect x="9" y="11" width="9" height="7" rx="1.5" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2"/><rect x="21" y="11" width="9" height="7" rx="1.5" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2"/><path d="M33 11h4.5q2.5 0 4.3 2.8L44 18H33Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/><path d="M4 21h47" stroke="#3E3A39" stroke-width="2"/><circle cx="14" cy="28" r="4.8" fill="#3E3A39"/><circle cx="14" cy="28" r="1.8" fill="#FFFCF6"/><circle cx="41" cy="28" r="4.8" fill="#3E3A39"/><circle cx="41" cy="28" r="1.8" fill="#FFFCF6"/><circle cx="50" cy="22.5" r="1.6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.2"/></svg>',
  walk: '<svg viewBox="0 0 54 36" aria-hidden="true"><circle cx="27" cy="7" r="4.5" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.4"/><path d="M27 12l-1 10" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round"/><path d="M22 14.5q4-2 9 1.5" fill="none" stroke="#3E3A39" stroke-width="2.4" stroke-linecap="round"/><path d="M23.5 13h7l-1 9h-6Z" fill="#F2A497" stroke="#3E3A39" stroke-width="2.2" stroke-linejoin="round"/><path d="M24 22l-4 10M28 22l4 9" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round"/><path d="M23 15l-4 6M31 15l4 5" stroke="#3E3A39" stroke-width="2.4" stroke-linecap="round"/></svg>',

  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.4" stroke-linejoin="round"/><rect x="9.5" y="13" width="5" height="7" fill="#F6D27A" stroke="#3E3A39" stroke-width="2"/></svg>',
  plane: '<svg viewBox="0 0 24 24"><path d="M2 13l8-2 4-8h2.5l-1.5 8 6 1.5V15l-6 0.5-1 5.5H12l-2-5-8-1Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/></svg>',
  fire: '<svg viewBox="0 0 24 24"><g stroke="#3E3A39" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3.5 3.5M14.9 14.9l3.5 3.5M5.6 18.4l3.5-3.5M14.9 9.1l3.5-3.5"/></g><circle cx="12" cy="12" r="2.6" fill="#F2A497" stroke="#3E3A39" stroke-width="2"/></svg>',
  fish: '<svg viewBox="0 0 24 24"><path d="M3 12q6-7 13-2l5-3v10l-5-3q-7 5-13-2Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="11" r="1.3" fill="#3E3A39"/></svg>',
  car: '<svg viewBox="0 0 24 24"><path d="M3 16v-4l2-5h14l2 5v4Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="17" r="2.3" fill="#3E3A39"/><circle cx="16.5" cy="17" r="2.3" fill="#3E3A39"/></svg>',
  p: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.2"/><path d="M9.5 17V7h3.5a3 3 0 0 1 0 6H9.5" fill="none" stroke="#3E3A39" stroke-width="2.4" stroke-linecap="round"/></svg>'
};
function modeIcon(m){return m==='walk'?SVG.walk:(m==='shuttle'?SVG.shuttle:SVG.van);}
function modeName(m){return m==='walk'?'步行':(m==='shuttle'?'接駁車':'自駕');}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toMin(t){var m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1]*60+ +m[2]):null;}
function fmtDur(min){if(min==null||isNaN(min))return '—';if(min<60)return min+' 分';var h=Math.floor(min/60),m=min%60;return h+' 小時'+(m?(' '+m+' 分'):'');}
function gmPlace(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.jp||p.name);}
function gmQuery(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
function gmDir(a,b,mode){return 'https://www.google.com/maps/dir/?api=1&origin='+a.lat+','+a.lng+'&destination='+b.lat+','+b.lng+'&travelmode='+(mode==='walk'?'walking':'driving');}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------- state ---------- */
var choices = store.get('oki27:choices',{});
var skips = store.get('oki27:skips',{});
var dayIdx = 0, route = [], legs = [], cur = -1, playing = false, animId = null;

/* Resolve a day's stops into timeline items and routable points */
function resolveDay(d){
  var items = DAYS[d].stops.map(function(s,i){
    var it = {src:s, idx:i, key:d+'-'+i, place:null, mode:s.mode||'car', est:s.est, routable:false, skipped:false};
    if(s.choice){
      var sel = choices[s.choice.key];
      var op = (sel!=null)? s.choice.options[sel] : null;
      if(op){it.place=op.place; it.mode=op.mode||'car'; it.est=op.est; it.choiceLabel=op.label;}
    } else if(s.place){ it.place=s.place; }
    if(s.skip && skips[it.key]) it.skipped=true;
    it.routable = !!it.place && !it.skipped;
    return it;
  });
  return items;
}

/* ---------- map ---------- */
var map = L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:false}).setView([26.45,127.85],9);
L.control.zoom({position:'bottomright'}).addTo(map);
map.attributionControl.addAttribution('行政區：国土数値情報（国土交通省）加工');
map.createPane('coast'); map.getPane('coast').style.zIndex=150;
COAST.forEach(function(r){L.polygon(r,{pane:'coast',color:INK,weight:1.4,opacity:.6,fillColor:'#F7EEDD',fillOpacity:1,interactive:false}).addTo(map);});
var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
var tileErr=0,tileOk=0;
tiles.on('tileerror',function(){tileErr++; if(tileErr>4&&tileOk===0) $('offline').style.display='block';});
tiles.on('tileload',function(){tileOk++; $('offline').style.display='none';});

var layer = L.layerGroup().addTo(map);
var vehicle = null;

/* ---------- routing (OSRM, cached) ---------- */
function routeKey(a,b){return 'oki27:r:'+a.lat+','+a.lng+';'+b.lat+','+b.lng;}
function fetchRoute(a,b){
  var k=routeKey(a,b), c=store.get(k,null);
  if(c) return Promise.resolve(c);
  var url='https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson';
  var ctl = ('AbortController' in window)? new AbortController():null;
  var to = setTimeout(function(){ if(ctl) ctl.abort(); },9000);
  return fetch(url, ctl?{signal:ctl.signal}:{}).then(function(r){return r.json();}).then(function(j){
    clearTimeout(to);
    if(!j.routes||!j.routes[0]) throw 0;
    var R=j.routes[0];
    var res={coords:R.geometry.coordinates.map(function(p){return [p[1],p[0]];}),min:Math.round(R.duration/60),km:Math.round(R.distance/100)/10,real:true};
    store.set(k,res); return res;
  }).catch(function(){clearTimeout(to);return null;});
}

/* ---------- render day ---------- */
function buildDay(d){
  stopAnim(); closeSheet(true);
  dayIdx=d; cur=-1; playing=false;
  var items=resolveDay(d);
  route = items.filter(function(it){return it.routable;});
  legs = [];
  for(var i=1;i<route.length;i++){
    var A=PLACES[route[i-1].place], B=PLACES[route[i].place];
    legs.push({from:i-1,to:i,a:A,b:B,mode:route[i].mode,est:route[i].est,estNote:route[i].src.estNote,coords:[[A.lat,A.lng],[B.lat,B.lng]],real:false,line:null,chip:null});
  }
  drawMap();
  renderTimeline(items);
  renderSummary();
  updateCtrl();
  fitDay(false);
  // fetch real roads for driving legs
  legs.forEach(function(L0){
    if(L0.mode!=='car') return;
    fetchRoute(L0.a,L0.b).then(function(r){
      if(!r||d!==dayIdx) return;
      L0.coords=r.coords; L0.real=true; L0.km=r.km; L0.osrmMin=r.min;
      redrawLeg(L0); renderTimeline(resolveDay(dayIdx));
    });
  });
  document.querySelectorAll('.day-btn').forEach(function(b,i){b.setAttribute('aria-selected',i===d?'true':'false');});
  store.set('oki27:day',d);
}

var pinMarkers=[];
function drawMap(){
  layer.clearLayers(); pinMarkers=[];
  if(vehicle){map.removeLayer(vehicle);vehicle=null;}
  legs.forEach(function(L0){redrawLeg(L0,true);});
  var seen={};
  route.forEach(function(it,i){
    var p=PLACES[it.place];
    var first=(i===0), last=(i===route.length-1);
    var inner = (p.icon&&SVG[p.icon])? SVG[p.icon] : String(i+1);
    if(it.place==='lodging') inner=SVG.home;
    var cls='pin'+(it.place==='lodging'?' home':'')+(it.src.choice?' opt':'');
    var m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="'+cls+'" data-i="'+i+'">'+inner+'</div>',iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:seen[it.place]?-50:100,keyboard:true,title:p.name});
    var lab=(first?'起點・':'')+(last?'終點・':'')+(it.src.short||p.name);
    if(seen[it.place]!=null){ // same place visited again (e.g., lodging)
      var prev=pinMarkers[seen[it.place]];
      if(prev._labels.indexOf(lab)<0) prev._labels.push(lab); prev.setTooltipContent(prev._labels.join(' / '));
      pinMarkers.push(prev); return;
    }
    m._labels=[lab];
    m.bindTooltip(lab,{permanent:true,direction:'top',offset:[0,-18],className:'pin-label'});
    m.on('click',function(){ var idxs=[]; pinMarkers.forEach(function(mm,j){if(mm===m) idxs.push(j);}); var j=idxs.indexOf(cur)>=0? idxs[(idxs.indexOf(cur)+1)%idxs.length] : idxs[0]; jumpTo(j); });
    m.addTo(layer); seen[it.place]=i; pinMarkers.push(m);
  });
  markPins();
}
function redrawLeg(L0,fresh){
  if(L0.line) layer.removeLayer(L0.line);
  if(L0.chip) layer.removeLayer(L0.chip);
  var walk=L0.mode!=='car';
  var sketch=!L0.real && L0.mode==='car';
  L0.line=L.polyline(L0.coords,{color:INK,weight:walk?3:5,opacity:.9,dashArray:walk?'2 9':(sketch?'10 10':null),lineCap:'round',lineJoin:'round'}).addTo(layer);
  if(!walk){ L0.line.setStyle({}); }
  var mid=L0.coords[Math.floor(L0.coords.length/2)];
  var txt=(walk?(L0.mode==='walk'?'🚶 ':'🚌 '):'🚗 ')+'約'+L0.est+'分'+(sketch?'・路線示意':'');
  L0.chip=L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<span class="leg-chip'+(sketch?' sketch':'')+'">'+txt+'</span>',iconSize:[0,0]})}).addTo(layer);
}
function markPins(){
  var st=new Map();
  route.forEach(function(it,i){var m=pinMarkers[i]; if(!m) return; var s=i===cur?2:(i<cur?1:0); if(!st.has(m)||s===2||(st.get(m)!==2&&s>st.get(m))) st.set(m,s);});
  st.forEach(function(s,m){ if(!m._icon) return; var el=m._icon.querySelector('.pin'); if(!el) return; el.classList.toggle('now',s===2); el.classList.toggle('done',s===1); });
}

/* ---------- summary ---------- */
function renderSummary(){
  var D=DAYS[dayIdx];
  if(!route.length){$('summary').textContent='';return;}
  var s=PLACES[route[0].place], far=null, fd=-1;
  route.forEach(function(it){var p=PLACES[it.place];var dd=Math.hypot(p.lat-s.lat,(p.lng-s.lng)*0.9);if(dd>fd){fd=dd;far=p;}});
  var dlat=far.lat-s.lat, dlng=far.lng-s.lng, dir;
  if(fd<0.05) dir='都在附近';
  else if(Math.abs(dlat)>=Math.abs(dlng)) dir= dlat>0?'往北 ↑':'往南 ↓';
  else dir= dlng>0?'往東 →':'往西 ←';
  var drive=legs.reduce(function(a,l){return a+(l.mode==='car'?(+l.est||0):0);},0);
  $('summary').innerHTML='<b>今天'+dir+'</b>'+(fd>=0.05?'・最遠 '+esc(far.name.replace(/（.*）/,'')):'')+'<br>自駕約 '+fmtDur(drive)+'・'+route.length+' 個點';
}

/* ---------- timeline ---------- */
function renderTimeline(items){
  var D=DAYS[dayIdx];
  $('tlTitle').textContent=D.date+'（'+D.wd+'）'+D.title+(D.fixed?'・固定行程':'');
  $('dayDot').style.background=D.color;
  var ol=$('timeline'); ol.innerHTML='';
  var rIndex=0;
  items.forEach(function(it){
    var s=it.src, li=document.createElement('li');
    var ri = it.routable? route.indexOf(it) : -1;
    if(ri<0 && it.routable){ for(var q=0;q<route.length;q++) if(route[q].key===it.key) ri=q; }
    var pend = !it.place;
    li.className=(pend?'pending ':'')+(it.skipped?'skipped ':'')+(s.big?'big ':'')+(ri>=0&&ri===cur?'isnow ':'')+(ri>=0&&ri<cur?'isdone':'');
    // leg row before this stop
    if(ri>0){
      var L0=legs[ri-1];
      var legHtml='<div class="leg">'+modeIcon(L0.mode)+'<span>'+modeName(L0.mode)+' 約 '+L0.est+' 分鐘（行程預估）'+(L0.estNote?'・'+esc(L0.estNote):'')+'</span>';
      if(L0.mode==='car') legHtml+= L0.real? '<span>・實際道路約 '+L0.km+' km'+(L0.osrmMin?'／道路估計 '+L0.osrmMin+' 分':'')+'</span>' : '<span class="sk">路線示意</span>';
      legHtml+=' <a href="'+gmDir(L0.a,L0.b,L0.mode)+'" target="_blank" rel="noopener">Google Maps 路線</a></div>';
      li.insertAdjacentHTML('beforeend',legHtml);
    }
    var tags=(s.tags||[]).map(function(t){return '<span class="tag'+(t==='固定行程'?' fix':'')+'">'+esc(t)+'</span>';}).join('');
    if(s.fixed && (s.tags||[]).indexOf('固定行程')<0) tags='<span class="tag fix">固定</span>'+tags;
    if(pend) tags='<span class="tag pend">'+esc(s.pending||'待選')+'</span>'+tags;
    if(s.choice && !it.place && !pend) tags='<span class="tag pend">待選</span>'+tags;
    if(it.choiceLabel) tags='<span class="tag skip">已選：'+esc(it.choiceLabel)+'</span>'+tags;
    var time=s.t+(s.end&&s.end!==s.t?'～'+s.end:'');
    var dot = ri>=0? String(ri+1) : (pend?'·':'');
    var row='<span class="dotm">'+dot+'</span><button class="row" '+(ri>=0?'data-ri="'+ri+'"':'disabled style="cursor:default"')+'><span class="tm">'+esc(time)+'</span><span class="ti">'+esc(s.title)+'</span>'+(tags?'<span class="tags">'+tags+'</span>':'')+'</button>';
    li.insertAdjacentHTML('beforeend',row);
    if(s.choice){
      var sel=choices[s.choice.key];
      var o='<div class="opts">'+s.choice.options.map(function(op,k){return '<button class="opt" data-ck="'+s.choice.key+'" data-k="'+k+'" aria-pressed="'+(sel===k)+'">'+esc(op.label)+'</button>';}).join('')+(sel!=null?'<button class="opt" data-ck="'+s.choice.key+'" data-k="-1">清除選擇</button>':'')+'</div>';
      li.insertAdjacentHTML('beforeend',o);
    }
    if(s.skip){
      li.insertAdjacentHTML('beforeend','<label class="switch"><input type="checkbox" data-sk="'+it.key+'" '+(it.skipped?'':'checked')+'> '+(it.skipped?'已略過，路線直接接下一站':'排入行程（關掉＝略過）')+'</label>');
    }
    ol.appendChild(li);
  });
  ol.querySelectorAll('.row[data-ri]').forEach(function(b){b.addEventListener('click',function(){jumpTo(+b.getAttribute('data-ri')); window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});});});
  ol.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){var k=+b.getAttribute('data-k'),ck=b.getAttribute('data-ck'); if(k<0) delete choices[ck]; else choices[ck]=k; store.set('oki27:choices',choices); buildDay(dayIdx);});});
  ol.querySelectorAll('input[data-sk]').forEach(function(c){c.addEventListener('change',function(){var k=c.getAttribute('data-sk'); if(c.checked) delete skips[k]; else skips[k]=true; store.set('oki27:skips',skips); buildDay(dayIdx);});});
}

/* ---------- view helpers ---------- */
function sheetOffset(){
  var sh=$('sheet'); if(!sh.classList.contains('open')) return [0,0];
  if(window.innerWidth>=900) return [-(sh.offsetWidth/2),0];
  var mapRect=$('map').getBoundingClientRect(); var shTop=sh.getBoundingClientRect().top;
  var covered=Math.max(0,mapRect.bottom-shTop);
  return [0, covered/2];
}
function fitDay(anim){
  var pts=[]; route.forEach(function(it){var p=PLACES[it.place];pts.push([p.lat,p.lng]);}); legs.forEach(function(l){pts=pts.concat(l.coords);});
  if(!pts.length) return;
  map.fitBounds(L.latLngBounds(pts),{padding:[50,50],paddingTopLeft:[30,70],paddingBottomRight:[60,70],animate:anim!==false&&!reduceMotion,maxZoom:15});
}
function focusPoint(latlng,zoom){
  var z=zoom||Math.max(map.getZoom(),13);
  var off=sheetOffset();
  var p=map.project(latlng,z).add(L.point(-off[0],off[1]));
  map.setView(map.unproject(p,z),z,{animate:!reduceMotion});
}

/* ---------- animation ---------- */
function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }
function ensureVehicle(mode,latlng){
  var html='<div class="vehicle">'+modeIcon(mode)+'</div>';
  var icon=L.divIcon({className:'',html:html,iconSize:[54,36],iconAnchor:[27,30]});
  if(!vehicle){vehicle=L.marker(latlng,{icon:icon,interactive:false,zIndexOffset:1000}).addTo(map);}
  else {vehicle.setIcon(icon); vehicle.setLatLng(latlng);}
}
function animateLeg(li,done){
  var L0=legs[li]; var pts=L0.coords.map(function(c){return L.latLng(c[0],c[1]);});
  var cum=[0]; for(var i=1;i<pts.length;i++) cum.push(cum[i-1]+pts[i-1].distanceTo(pts[i]));
  var total=cum[cum.length-1]||1;
  ensureVehicle(L0.mode,pts[0]);
  var b=L.latLngBounds(pts);
  map.fitBounds(b,{paddingTopLeft:[40,80],paddingBottomRight:[70,80],maxZoom:15,animate:!reduceMotion});
  if(reduceMotion){ vehicle.setLatLng(pts[pts.length-1]); done(); return; }
  var km=total/1000, dur=L0.mode==='car'? Math.min(7000,Math.max(2200,km*130)) : Math.min(3500,Math.max(1600,km*2500));
  var t0=null, lastFlip=null;
  function frame(ts){
    if(t0==null) t0=ts+350; // wait for fitBounds
    var k=Math.max(0,Math.min(1,(ts-t0)/dur)); var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    var dist=e*total, j=1; while(j<cum.length-1 && cum[j]<dist) j++;
    var seg=(cum[j]-cum[j-1])||1, f=(dist-cum[j-1])/seg;
    var a=pts[j-1], c=pts[j]; var pos=L.latLng(a.lat+(c.lat-a.lat)*f, a.lng+(c.lng-a.lng)*f);
    vehicle.setLatLng(pos);
    var flip=(c.lng<a.lng); if(flip!==lastFlip && vehicle._icon){var v=vehicle._icon.querySelector('.vehicle'); if(v) v.classList.toggle('flip',flip); lastFlip=flip;}
    if(k<1) animId=requestAnimationFrame(frame); else {animId=null; done();}
  }
  animId=requestAnimationFrame(frame);
}

/* ---------- flow ---------- */
function arrive(i){
  cur=i; markPins(); renderTimeline(resolveDay(dayIdx));
  var p=PLACES[route[i].place];
  if(!vehicle){ ensureVehicle(route[i].mode==='walk'?'walk':(i===0&&dayIdx===0?'walk':'car'),[p.lat,p.lng]); }
  else vehicle.setLatLng([p.lat,p.lng]);
  openSheet(i);
  setTimeout(function(){focusPoint(L.latLng(p.lat,p.lng));},reduceMotion?0:340);
  playing=false; updateCtrl();
}
function start(){ closeSheet(true); stopAnim(); playing=false; cur=-1; markPins(); arrive(0); }
function next(){
  if(playing) return;
  if(cur<0){start();return;}
  if(cur>=route.length-1) return;
  closeSheet(); playing=true; updateCtrl();
  var target=cur+1;
  animateLeg(cur, function(){ arrive(target); });
}
function prev(){ if(playing) return; if(cur<=0) return; stopAnim(); jumpTo(cur-1); }
function jumpTo(i){ stopAnim(); playing=false; var p=PLACES[route[i].place]; ensureVehicle(i>0?legs[i-1].mode:'car',[p.lat,p.lng]); arrive(i); }
function replay(){ stopAnim(); closeSheet(true); if(vehicle){map.removeLayer(vehicle);vehicle=null;} cur=-1; playing=false; markPins(); renderTimeline(resolveDay(dayIdx)); fitDay(); setTimeout(start, reduceMotion?0:700); }
function updateCtrl(){
  var m=$('btnMain');
  if(cur<0) m.textContent='開始行程';
  else if(cur>=route.length-1) m.textContent='今日結束';
  else m.textContent=playing?'移動中…':'下一站';
  m.disabled = playing || (cur>=route.length-1 && cur>=0);
  $('btnPrev').disabled = playing || cur<=0;
  $('shPrev').disabled = playing || cur<=0;
  $('shNext').disabled = playing || cur>=route.length-1;
  $('shNext').textContent = cur>=route.length-1 ? '今日結束' : '下一站';
}

/* ---------- sheet ---------- */
function infoRows(key){
  var rows=INFO[key]||[]; if(!rows.length) return '<p style="margin:0">尚無資料，待確認。</p>';
  return '<dl class="kv">'+rows.map(function(r){
    var src=r.src&&SRC[r.src]; var sl=src?('<div class="srcline">來源：'+(src.url?'<a href="'+src.url+'" target="_blank" rel="noopener">'+esc(src.name)+'</a>':esc(src.name))+'｜查詢 '+QUERY_DATE+'</div>'):'';
    return '<dt>'+esc(r.k)+'</dt><dd>'+esc(r.v)+'<span class="badge '+(r.s==='ok'?'ok':'tbc')+'">'+(r.s==='ok'?'已查到':'待確認')+'</span>'+sl+'</dd>';
  }).join('')+'</dl>';
}
function hoursOf(key){
  var t={naminoue:{open:'09:00',close:'17:00'},parco:{open:'10:00',close:'22:00'},churaumi:{open:'08:30',close:'18:30',last:'17:30'},okiworld:{open:'09:00',close:'17:30',last:'16:00'},manzamo:{open:'08:00',close:'20:00'},senaga:{open:'10:00',close:'21:00'},maeda:{open:'07:00',close:'19:00',label:'停車場'},kokusai:{open:'08:00',close:'22:00',label:'市場（依店家）'}};
  return t[key];
}
function autoAlerts(it){
  var out=[], h=hoursOf(it.place), s=it.src, a=toMin(s.t), d=toMin(s.end);
  if(h){
    var lab=h.label?h.label:'';
    if(a!=null && a<toMin(h.open)) out.push('預計 '+s.t+' 抵達時'+lab+'還沒開（'+h.open+' 開）。');
    if(h.last && a!=null && a>toMin(h.last)) out.push('預計抵達已過最後入場 '+h.last+'。');
    else if(h.last && a!=null && toMin(h.last)-a<=60) out.push('接近最後入場（'+h.last+'）。');
    if(d!=null && d>toMin(h.close)) out.push('預計離開 '+s.end+' 晚於關門 '+h.close+'。');
  }
  if(it.place==='seaside' && a!=null && a<toMin('14:30')) out.push('2026 年停車場 14:30 才開放。');
  if(it.place==='rental' && dayIdx===4) out.push('17:00 固定還車，16:00 前要開始加油、整理行李。');
  return out.concat(s.alerts||[]);
}
function openSheet(i){
  var it=route[i], s=it.src, p=PLACES[it.place];
  $('shNum').innerHTML = it.place==='lodging'? SVG.home.replace('<svg','<svg width="20" height="20"') : String(i+1);
  $('shTitle').textContent = s.title + (it.choiceLabel?'：'+it.choiceLabel:'');
  $('shSub').textContent = DAYS[dayIdx].date+'（'+DAYS[dayIdx].wd+'）・'+p.name+(p.approx?'・座標約略':'');
  var a=toMin(s.t), dd=toMin(s.end), stay=(a!=null&&dd!=null)? dd-a : null;
  var h='';
  h+='<div class="times"><div><small>預計抵達</small><b>'+esc(s.t||'—')+'</b></div><div><small>預計離開</small><b>'+esc(s.end||'—')+'</b></div><div><small>停留</small><b>'+(stay!=null&&stay>0?fmtDur(stay):'—')+'</b></div></div>';
  h+='<div class="plan-note">以上為行程預估時間，非官方公告。</div>';
  h+='<div class="what">'+esc(s.todo||'')+'</div>';
  if(s.steps&&s.steps.length) h+='<ol class="steps">'+s.steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(s.tags&&s.tags.length) h+='<div class="tags">'+s.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>';
  var al=autoAlerts(it);
  if(al.length) h+='<div class="alert"><b>⏰ 時間提醒</b><ul>'+al.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
  h+='<details open><summary>🕘 營業與入場（官方／查詢資料）</summary><div class="dbody">'+infoRows(it.place)+'<div><a class="maplink" href="'+gmPlace(p)+'" target="_blank" rel="noopener">📍 Google Maps 定位</a>'+(i>0?' <a class="maplink" style="background:var(--yellow)" href="'+gmDir(PLACES[route[i-1].place],p,it.mode)+'" target="_blank" rel="noopener">🧭 從上一站的路線</a>':'')+'</div></div></details>';
  var foods=(s.food||[]).map(function(k){return FOOD[k];}).filter(Boolean);
  // include food from pending meal items right after this stop
  var items=DAYS[dayIdx].stops, idx=it.idx;
  for(var q=idx+1;q<items.length && !items[q].place && !items[q].choice;q++){ (items[q].food||[]).forEach(function(k){ if(FOOD[k]&&foods.indexOf(FOOD[k])<0) foods.push(FOOD[k]); }); }
  if(foods.length){
    h+='<details><summary>🍜 附近美食（'+foods.length+'）</summary><div class="dbody">'+foods.slice(0,3).map(function(f){
      return '<div class="food"><b>'+esc(f.name)+'</b><p>推薦：'+esc(f.dish)+'</p><p>距離：'+esc(f.from)+'</p><p>營業：'+esc(f.hours)+'<span class="badge '+(f.s==='ok'?'ok':'tbc')+'">'+(f.s==='ok'?'已查到':'待確認')+'</span></p><p><a class="maplink" href="'+gmQuery(f.q)+'" target="_blank" rel="noopener">📍 地圖</a></p></div>';
    }).join('')+'</div></details>';
  }
  if(s.notes&&s.notes.length) h+='<div style="font-size:13.5px;color:var(--ink-soft)">'+s.notes.map(esc).join('<br>')+'</div>';
  $('shBody').innerHTML=h; $('shBody').scrollTop=0;
  var sh=$('sheet'); sh.classList.add('open'); sh.classList.remove('tall'); document.body.classList.add('sheet-open');
  updateCtrl();
}
function closeSheet(instant){ var sh=$('sheet'); sh.classList.remove('open','tall'); document.body.classList.remove('sheet-open'); }
$('shClose').addEventListener('click',function(){closeSheet();});
$('grab').addEventListener('click',function(){$('sheet').classList.toggle('tall');});
$('shNext').addEventListener('click',next);
$('shPrev').addEventListener('click',prev);
$('btnMain').addEventListener('click',next);
$('btnPrev').addEventListener('click',prev);
$('btnReplay').addEventListener('click',replay);
$('btnFit').addEventListener('click',function(){closeSheet(); fitDay();});

/* ---------- static parts ---------- */
$('dates').textContent=META.dates;
$('chips').innerHTML=['🏠 '+META.lodgingLabel,'✈️ '+META.flightGo,'✈️ '+META.flightBack,'🚙 '+META.car,'🎆 4/17 煙火（固定）'].map(function(t,i){return '<span class="chip'+(/待/.test(t)?' tbc':'')+'">'+esc(t)+'</span>';}).join('');
$('days').innerHTML=DAYS.map(function(d,i){return '<button class="day-btn" role="tab" aria-selected="false" data-d="'+i+'"><b>'+d.date+'</b><small>'+d.wd+'・'+esc(d.title)+'</small></button>';}).join('');
document.querySelectorAll('.day-btn').forEach(function(b){b.addEventListener('click',function(){buildDay(+b.getAttribute('data-d'));});});
$('todo').innerHTML=POOL.todo.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
$('wish').innerHTML=POOL.wish.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
$('cut').innerHTML=POOL.cut.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
$('qdate').textContent=QUERY_DATE;
$('srcList').innerHTML=Object.keys(SRC).map(function(k){var s=SRC[k];return '<li>'+(s.url?'<a href="'+s.url+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>':esc(s.name))+'</li>';}).join('');

window.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key==='Escape') closeSheet(); });
var startDay=store.get('oki27:day',0); if(!(startDay>=0&&startDay<DAYS.length)) startDay=0;
buildDay(startDay);
window.__trip={next:next,prev:prev,buildDay:buildDay,state:function(){return {day:dayIdx,cur:cur,playing:playing,route:route.length,legs:legs.length};}};
})();
</script>
